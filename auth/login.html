<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de OS</title>
    <!-- Favicon -->
    <link rel="icon" href="./site/images/logo.jpg" type="image/x-icon">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./site/style/css.css">
</head>
<body id="page-login">

    <div class="login-container fade-in">
        <div class="login-card p-2">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="mb-3">
                        <i class="fas fa-tools fa-3x text-accent"></i>
                    </div>
                    <h2 class="card-title h3">Elias TechMaster</h2>
                    <p class="text-muted small">Gerenciamento de Ordens de Serviço</p>
                </div>
                
                <form id="login-form">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-medium">E-mail de Acesso</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0" id="email" placeholder="nome@empresa.com" required autocomplete="email">
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <label for="password" class="form-label fw-medium mb-0">Senha</label>
                            <a href="#" id="btn-abrir-esqueci-senha" class="text-decoration-none small text-muted hover-underline" data-bs-toggle="modal" data-bs-target="#modalEsqueciSenha">
                                <i class="fas fa-key me-1"></i>Esqueci minha senha
                            </a>
                        </div>
                        <div class="input-group mt-1">
                            <span class="input-group-text bg-white border-end-0"><i class="fas fa-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0" id="password" placeholder="••••••••" required autocomplete="current-password">
                        </div>
                    </div>
                    
                    <div id="login-error" class="alert alert-danger d-none mb-3 py-2 small" role="alert"></div>

                    <div class="d-grid mt-4">
                        <button type="submit" id="login-button" class="btn btn-primary btn-lg-custom shadow-sm">
                            Acessar Sistema <i class="fas fa-arrow-right ms-2 small"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Esqueci Minha Senha / Redefinir Senha Local -->
    <div class="modal fade" id="modalEsqueciSenha" tabindex="-1" aria-labelledby="modalEsqueciSenhaLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg border-0">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold" id="modalEsqueciSenhaLabel">
                        <i class="fas fa-unlock-alt me-2 text-success"></i>Redefinir Senha
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body pt-3 pb-2">
                    <p class="text-muted small mb-3">
                        Selecione o usuário desejado e defina uma nova senha de acesso direto.
                    </p>

                    <div id="reset-feedback" class="alert d-none py-2 small mb-3" role="alert"></div>

                    <form id="form-reset-senha">
                        <!-- Dropdown de Usuários -->
                        <div class="mb-3">
                            <label for="reset-user-select" class="form-label fw-medium">Selecione o Usuário</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="fas fa-user text-muted"></i></span>
                                <select class="form-select border-start-0" id="reset-user-select" required>
                                    <option value="" disabled selected>Carregando usuários...</option>
                                </select>
                            </div>
                        </div>

                        <!-- Nova Senha -->
                        <div class="mb-3">
                            <label for="reset-nova-senha" class="form-label fw-medium">Nova Senha</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" class="form-control border-start-0" id="reset-nova-senha" placeholder="Digite a nova senha" required>
                            </div>
                        </div>

                        <!-- Confirmação de Senha -->
                        <div class="mb-3">
                            <label for="reset-confirma-senha" class="form-label fw-medium">Repetir Nova Senha</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="fas fa-check-double text-muted"></i></span>
                                <input type="password" class="form-control border-start-0" id="reset-confirma-senha" placeholder="Confirme a nova senha" required>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top-0 pt-0">
                    <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="btn-salvar-reset" class="btn btn-success btn-sm px-3">
                        <i class="fas fa-save me-1"></i>Salvar Nova Senha
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script de autenticação dedicado -->
    <script src="auth.js"></script>
</body>
</html>
