<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações do Sistema</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../style/css.css">
    <style>
        #config-iframe {
            width: 100%;
            border: none;
            min-height: 75vh;
        }
    </style>
</head>
<body id="page-configuracoes" class="iframe-page fade-in">
    <div class="container-fluid p-0">
        
        <!-- HERO / HEADER -->
        <div class="dashboard-hero-card mb-4 p-4 shadow-sm">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="hero-icon-wrapper" style="background: linear-gradient(135deg, rgba(71, 85, 105, 0.35), rgba(51, 65, 85, 0.2));">
                        <i class="fas fa-sliders text-light"></i>
                    </div>
                    <div>
                        <h2 class="hero-title mb-1">Central de Configurações</h2>
                        <p class="hero-subtitle mb-0">Parâmetros de SMTP, chaves PIX, dados da empresa, NFS-e e contas de acesso</p>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="system-status-pill">
                        <i class="fas fa-shield-halved me-1"></i>
                        <span>Ambiente Protegido</span>
                    </span>
                </div>
            </div>
        </div>

        <div class="glass-card shadow-sm overflow-hidden mb-5">
            <div class="card-header bg-white border-0 pb-0 pt-3 px-4">
                <ul class="nav nav-tabs card-header-tabs border-0" id="config-tabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active fw-bold border-0" id="email-config-tab" data-bs-toggle="tab" data-iframe-src="config_page/config_email.html" type="button" role="tab">
                            <i class="fas fa-envelope me-1 text-primary"></i> E-mail & SMTP
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link fw-bold border-0" id="pix-config-tab" data-bs-toggle="tab" data-iframe-src="config_page/config_pix.html" type="button" role="tab">
                            <i class="fas fa-qrcode me-1 text-success"></i> Chaves PIX
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link fw-bold border-0" id="nfse-config-tab" data-bs-toggle="tab" data-iframe-src="config_page/config_nfse.html" type="button" role="tab">
                            <i class="fas fa-building me-1 text-info"></i> Empresa & NFS-e
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link fw-bold border-0" id="email-queue-tab" data-bs-toggle="tab" data-iframe-src="config_page/config_fila.html" type="button" role="tab">
                            <i class="fas fa-paper-plane me-1 text-warning"></i> Fila de Envios
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link fw-bold border-0" id="usuarios-tab" data-bs-toggle="tab" data-iframe-src="config_page/config_users.html" type="button" role="tab">
                            <i class="fas fa-user-shield me-1 text-secondary"></i> Usuários
                        </button>
                    </li>
                </ul>
            </div>
            <div class="card-body p-0">
                <!-- O Iframe carregará o conteúdo das abas -->
                <iframe id="config-iframe" src="config_page/config_email.html" onload="this.style.height = (this.contentWindow.document.body.scrollHeight + 50) + 'px';"></iframe>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../script/common.js"></script> 
    <script src="../script/configuracoes.js"></script>
</body>
</html>
